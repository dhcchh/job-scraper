name: Daily Greenhouse scrape

on:
  schedule:
    # 04:00 UTC = 12:00 Singapore time (UTC+8, no DST).
    # NOTE: GitHub Actions cron is best-effort and can be delayed under
    # platform load -- a known caveat, not something this workflow works
    # around.
    - cron: "0 4 * * *"
  workflow_dispatch: {}

# Only one scrape at a time. Concurrent runs could both read the same existing
# keys before either appends, then create duplicate rows. Queue rather than
# canceling: each run gets a complete read/append/prune cycle.
concurrency:
  group: daily-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked

      - name: Run scraper
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: uv run python -m jobscraper.main
