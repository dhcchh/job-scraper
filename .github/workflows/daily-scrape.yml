name: Daily Scrape (Append)

on:
  push:
    branches:
      - main
    paths:
      - "company_toml/*_boards.toml"
  schedule:
    # 23:00 UTC = 07:00 Singapore time the NEXT day (UTC+8, no DST) -- so
    # this fires on the previous UTC date to land on a Singapore morning.
    # NOTE: GitHub Actions cron is best-effort and can be delayed under
    # platform load (often by tens of minutes at the top of an hour) -- a
    # known caveat, not something this workflow works around, so treat
    # 07:00 SGT as the earliest it starts rather than a guaranteed time.
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      force_prune_firms:
        description: >-
          Comma-separated firms whose held-back prune should go ahead this run
          (only after confirming their postings really closed)
        required: false
        default: ""
        type: string

# Shared with full-refresh.yml: both read-then-write every tab, so they must
# never run at the same time -- concurrent runs could both read the same
# existing keys before either writes, then create duplicate or clobbered
# rows. Queue rather than cancel: each run gets a complete read/write cycle.
concurrency:
  group: sheet-write
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked

      - name: Run scraper
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          # Optional Telegram digest (see telegram.py/.env.example) -- an
          # unset repo secret comes through as "", which config.py already
          # treats the same as not-set-at-all, so this feature stays off
          # until all three of these are actually added as repo secrets.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
          TELEGRAM_COMPANIES_CHAT_ID: ${{ secrets.TELEGRAM_COMPANIES_CHAT_ID }}
          TELEGRAM_COMPANIES_THREAD_ID: ${{ secrets.TELEGRAM_COMPANIES_THREAD_ID }}
          # Empty on schedule/push runs, which have no inputs.
          FORCE_PRUNE_FIRMS: ${{ inputs.force_prune_firms }}
        run: uv run python -m jobscraper.main
