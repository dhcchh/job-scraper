name: Daily Scrape (Append)

on:
  push:
    branches:
      - main
    paths:
      - "company_toml/*_boards.toml"
  schedule:
    # 07:00 Singapore time the next day; GitHub schedules can be delayed.
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      force_prune_firms:
        description: >-
          Comma-separated firms whose held-back prune should go ahead this run
          (only after confirming their postings really closed)
        required: false
        default: ""
        type: string

# Serialize the four workflows that write to the production sheet.
concurrency:
  group: sheet-write
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so "Detect changed boards" can diff against the push's
          # own base commit; a depth-1 clone has no parent to diff against.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests before writing
        run: uv run pytest

      - name: Detect changed boards (push only)
        id: changed_boards
        if: github.event_name == 'push'
        env:
          BASE_REF: ${{ github.event.before }}
        run: >-
          uv run python -m jobscraper.changed_boards
          --base "$BASE_REF" --head "$GITHUB_SHA"
          --github-output "$GITHUB_OUTPUT"

      # A TOML push that only removed entries selects no firms. Skip the
      # scrape rather than reading the empty ONLY_FIRMS as "every board".
      - name: Install Chromium if Citadel is selected
        if: github.event_name != 'push' || steps.changed_boards.outputs.firms != ''
        env:
          ONLY_FIRMS: ${{ steps.changed_boards.outputs.firms }}
        run: uv run python -m jobscraper.job_boards.citadel.install

      - name: Run scraper
        if: github.event_name != 'push' || steps.changed_boards.outputs.firms != ''
        env:
          GOOGLE_SHEET_TITLE: ${{ secrets.GOOGLE_SHEET_TITLE }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          # Digest needs a bot token and chat ID; the topic ID is optional.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
          TELEGRAM_COMPANIES_CHAT_ID: ${{ secrets.TELEGRAM_COMPANIES_CHAT_ID }}
          TELEGRAM_COMPANIES_THREAD_ID: ${{ secrets.TELEGRAM_COMPANIES_THREAD_ID }}
          # Optional per-role DMs of new SG/HK data-engineering postings (alerts.py).
          TELEGRAM_DM_CHAT_ID: ${{ secrets.TELEGRAM_DM_CHAT_ID }}
          # Empty on schedule/push runs, which have no inputs.
          FORCE_PRUNE_FIRMS: ${{ inputs.force_prune_firms }}
          # On a TOML push, fetch firms with added or modified boards. Empty on cron/
          # workflow_dispatch so the full board list runs as normal.
          ONLY_FIRMS: ${{ steps.changed_boards.outputs.firms }}
        run: uv run python -m jobscraper.main

      - name: No changed boards detected
        if: github.event_name == 'push' && steps.changed_boards.outputs.firms == ''
        run: echo "No added or modified boards -- skipping the scrape."

      - name: Audit sheet data quality
        if: ${{ !cancelled() }}
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_TITLE: ${{ secrets.GOOGLE_SHEET_TITLE }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: uv run python -m jobscraper.sheets.audit

      - name: Upload data quality report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: data-quality
          path: data-quality.json
          if-no-files-found: warn
          retention-days: 14
