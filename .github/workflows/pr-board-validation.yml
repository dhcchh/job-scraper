name: Validate Changed Boards (PR)

# Validate added or modified board entries before merge.
on:
  pull_request:
    paths:
      - "company_toml/*_boards.toml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked

      - name: Detect changed boards
        id: changed_boards
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.sha }}
        run: >-
          uv run python -m jobscraper.changed_boards
          --base "$BASE_REF" --head "$HEAD_REF" --merge-base
          --github-output "$GITHUB_OUTPUT"

      - name: Validate changed boards
        if: steps.changed_boards.outputs.firms != ''
        env:
          ONLY_FIRMS: ${{ steps.changed_boards.outputs.firms }}
        run: uv run python -m jobscraper.board_health

      - name: No changed boards detected
        if: steps.changed_boards.outputs.firms == ''
        run: echo "No added or modified boards -- skipping board fetch."
