name: Full Refresh (Rebuild)

# Manual only -- run after a change to classify_roles.classify_job's
# category keywords, classify_region.classify_region's PAC country list,
# FIELDS, location normalization, first_published, or
# models.FIRMS_NEEDING_DESCRIPTION has piled up enough stale/misplaced rows
# to be worth a full rebuild. See sheets/full_refresh.py's module docstring
# for exactly what this recomputes and re-routes.
on:
  workflow_dispatch: {}

# Shared with daily-scrape.yml: both read-then-write every tab, so they must
# never run at the same time -- concurrent runs could both read the same
# existing keys before either writes, then create duplicate or clobbered
# rows. Queue rather than cancel: each run gets a complete read/write cycle.
concurrency:
  group: sheet-write
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked

      - name: Run full refresh
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: uv run python -m jobscraper.sheets.full_refresh
