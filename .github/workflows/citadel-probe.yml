name: Citadel Browser Probe

on:
  schedule:
    # Daily at 06:00 Singapore time, ahead of the production scrape.
    - cron: "0 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

concurrency:
  group: citadel-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest

      - name: Install Chromium
        run: uv run playwright install chromium --with-deps --no-shell

      - name: Probe Citadel listings
        id: probe
        run: >-
          uv run jobscraper-citadel-probe
          --output citadel-probe/report.json
          --diagnostics-dir citadel-probe

      - name: Report activation gate
        if: ${{ !cancelled() }}
        uses: actions/github-script@v7
        env:
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const {data: current} = await github.rest.actions.getWorkflowRun({
              owner, repo, run_id: context.runId,
            });
            const {data} = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: 'citadel-probe.yml',
              event: 'schedule', branch: 'main', per_page: 10,
            });
            const previous = data.workflow_runs
              .filter(run => run.id !== context.runId && run.created_at < current.created_at)
              .sort((a, b) => b.created_at.localeCompare(a.created_at));
            const counts = context.eventName === 'schedule'
              && context.ref === 'refs/heads/main'
              && process.env.PROBE_OUTCOME === 'success';
            let streak = counts ? 1 : 0;
            if (counts) {
              for (const run of previous.slice(0, 2)) {
                if (run.conclusion !== 'success' || run.head_sha !== context.sha) break;
                streak++;
              }
            }
            await core.summary
              .addHeading('Citadel activation gate')
              .addRaw(`Consecutive useful scheduled passes on this main commit: ${streak}/3.\n\n`)
              .addRaw(streak === 3
                ? 'Gate passed. Enable the Citadel board in a reviewed configuration change; this workflow does not modify production.\n'
                : 'Keep Citadel disabled. Manual runs do not count; failures or code changes restart the gate.\n')
              .write();

      - name: Upload probe report and failure screenshot
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: citadel-probe
          path: |
            citadel-probe/report.json
            citadel-probe/failure.png
          if-no-files-found: warn
          retention-days: 3
