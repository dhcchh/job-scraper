name: Backfill (Refresh Existing Rows)

# Refresh existing rows in place. Use Full Refresh for routing changes.
on:
  workflow_dispatch: {}

# Serialize the four workflows that write to the production sheet.
concurrency:
  group: sheet-write
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests before writing
        run: uv run pytest

      - name: Install Chromium if Citadel is configured
        run: uv run python -m jobscraper.job_boards.citadel.install --all-firms

      - name: Run backfill
        env:
          GOOGLE_SHEET_TITLE: ${{ secrets.GOOGLE_SHEET_TITLE }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: uv run python -m jobscraper.sheets.backfill

      - name: Audit sheet data quality
        if: ${{ !cancelled() }}
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_TITLE: ${{ secrets.GOOGLE_SHEET_TITLE }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: uv run python -m jobscraper.sheets.audit

      - name: Upload data quality report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: data-quality
          path: data-quality.json
          if-no-files-found: warn
          retention-days: 14
