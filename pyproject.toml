[project]
name = "latest-job-scraper"
version = "0.1.0"
description = "Daily job-board scraper with Google Sheets tracking and optional Telegram alerts."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-auth>=2.58.0",
    "gspread>=6.2.1",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobscraper"]

[tool.hatch.build.targets.wheel.force-include]
company_toml = "jobscraper/company_toml"

[tool.pytest.ini_options]
pythonpath = ["src"]
